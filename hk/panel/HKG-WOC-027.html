<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKG-WOC-027 Panel Page</title>
    <style>
        body {
            margin: 0;
            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;
            -webkit-box-pack: center;
            -ms-flex-pack: center;
            justify-content: center;
            -webkit-box-align: center;
            -ms-flex-align: center;
            align-items: center;
            min-height: 100vh;
            background: #f0f0f0;
            overflow: auto;
            position: relative;
        }
        .container {
            width: 100vw;
            height: calc(100vw * 9 / 16);
            max-width: 100%;
            max-height: 100vh;
            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;
            background: white;
            -webkit-box-shadow: 0 0 10px rgba(0,0,0,0.1);
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            overflow: auto;
        }
        .left {
            -webkit-box-flex: 1;
            -ms-flex: 1 1 auto;
            flex: 1 1 auto;
            height: 100%;
            min-width: 0;
        }
        .right {
            width: 420px;
            -webkit-box-flex: 0;
            -ms-flex: 0 0 420px;
            flex: 0 0 420px;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .button-container {
            position: fixed;
            top: 10px;
            right: 10px;
            display: -webkit-box;
            display: -ms-flexbox;
            display: flex;
            gap: 10px;
            z-index: 1000;
            /* Hidden by default — JS controls visibility for old-browser safety */
            visibility: hidden;
            opacity: 0;
        }
        .button-container.visible {
            visibility: visible;
            opacity: 1;
        }
        .control-button {
            padding: 6px 12px;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;         /* Small but readable */
            white-space: nowrap;
        }
        .control-button:hover {
            background: #555;
        }
        @media (max-width: 800px) {
            .container {
                -webkit-box-orient: vertical;
                -webkit-box-direction: normal;
                -ms-flex-direction: column;
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                overflow-y: auto;
            }
            .left {
                height: 50vh;
                min-height: 300px;
            }
            .right {
                width: 100%;
                height: 450px;
                -webkit-box-flex: 0;
                -ms-flex: 0 0 auto;
                flex: 0 0 auto;
            }
            .button-container {
                top: 5px;
                right: 5px;
                -webkit-box-orient: vertical;
                -webkit-box-direction: normal;
                -ms-flex-direction: column;
                flex-direction: column;
                gap: 5px;
            }
            .control-button {
                padding: 5px 10px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="button-container" id="btnContainer">
        <button class="control-button" onclick="toggleFullScreen()">Toggle Full Screen</button>
        <button class="control-button" onclick="clearCache()">Clear Cache</button>
    </div>

    <div class="container">
        <div class="left">
            <iframe src="https://compassoffices.github.io/hk/HKG-WOC-027.html"></iframe>
        </div>
        <div class="right">
            <iframe src="https://compassoffices.github.io/410/event.html"></iframe>
        </div>
    </div>

    <script>
        // ── Button show/hide via JS (works on IE9+, no CSS transition needed) ──
        var btnContainer = document.getElementById('btnContainer');
        var hideTimer;

        function showButtons() {
            if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
            btnContainer.className = 'button-container visible';
        }

        function scheduleHide() {
            hideTimer = setTimeout(function() {
                btnContainer.className = 'button-container';
            }, 1500); // hide 1.5s after mouse leaves body
        }

        // Standard addEventListener with IE8 fallback
        function addEvent(el, evt, fn) {
            if (el.addEventListener) {
                el.addEventListener(evt, fn, false);
            } else if (el.attachEvent) {
                el.attachEvent('on' + evt, fn);
            }
        }

        addEvent(document.body, 'mouseover', showButtons);
        addEvent(document.body, 'mouseout',  scheduleHide);

        // Keep buttons visible while hovering over them directly
        addEvent(btnContainer, 'mouseover', showButtons);
        addEvent(btnContainer, 'mouseout',  scheduleHide);

        // ── Full screen ──
        function toggleFullScreen() {
            var el = document.documentElement;
            var isFS = document.fullscreenElement || document.webkitFullscreenElement
                    || document.mozFullScreenElement || document.msFullscreenElement;
            if (!isFS) {
                if (el.requestFullscreen)       { el.requestFullscreen(); }
                else if (el.webkitRequestFullscreen) { el.webkitRequestFullscreen(); }
                else if (el.mozRequestFullScreen)    { el.mozRequestFullScreen(); }
                else if (el.msRequestFullscreen)     { el.msRequestFullscreen(); }
            } else {
                if (document.exitFullscreen)          { document.exitFullscreen(); }
                else if (document.webkitExitFullscreen){ document.webkitExitFullscreen(); }
                else if (document.mozCancelFullScreen) { document.mozCancelFullScreen(); }
                else if (document.msExitFullscreen)    { document.msExitFullscreen(); }
            }
        }

        // ── Clear cache ──
        function clearCache() {
            var wasFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement
                || document.mozFullScreenElement || document.msFullscreenElement);

            if (window.caches) {
                caches.keys().then(function(names) {
                    return Promise.all(names.map(function(n) { return caches.delete(n); }));
                }).catch(function(err) { console.error('Cache clear error:', err); });
            }

            var iframes = document.querySelectorAll('iframe');
            for (var i = 0; i < iframes.length; i++) {
                var orig = iframes[i].src.split('?')[0];
                iframes[i].src = orig + '?cb=' + Date.now();
            }

            if (wasFullscreen) { toggleFullScreen(); }
        }

        // ── Auto clear at 9 AM and 4 PM ──
        function scheduleCacheClear() {
            var now = new Date();
            var nextClear;

            if (now.getHours() < 9 || (now.getHours() === 9 && now.getMinutes() < 1)) {
                nextClear = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 9, 0, 0);
            } else if (now.getHours() < 16 || (now.getHours() === 16 && now.getMinutes() < 1)) {
                nextClear = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 16, 0, 0);
            } else {
                nextClear = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 9, 0, 0);
            }

            var ms = nextClear.getTime() - now.getTime();
            setTimeout(function() {
                clearCache();
                setInterval(function() {
                    var h = new Date().getHours();
                    if (h === 9 || h === 16) { clearCache(); }
                }, 60 * 60 * 1000);
            }, ms);
        }

        scheduleCacheClear();
    </script>
</body>
</html>
